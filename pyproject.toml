[project]
name = "missionagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "pillow>=11.0.0",
    "opencv-python>=4.13.0.92",
    "numpy>=1.26.0",
    "onnxruntime>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
export = [
    "ultralytics>=8.3.0",
    "onnx>=1.12.0,<2.0.0",
    "onnxslim>=0.1.71",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["agent/tests"]
